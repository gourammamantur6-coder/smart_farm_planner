<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">

    <h2>🌱 Smart Farm Planner</h2>

    <form id="soilForm" onsubmit="analyzeSoil(event)">

        <label>Farmer Name</label>
        <input type="text" id="name"
        placeholder="Enter Farmer Name" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile"
        placeholder="Enter Mobile Number"
        pattern="[0-9]{10}" maxlength="10" required>

        <label>Soil Type</label>
        <select id="soilType" required>
            <option value="">Select Soil Type</option>
            <option value="Red Soil">Red Soil</option>
            <option value="Black Soil">Black Soil</option>
            <option value="Sandy Soil">Sandy Soil</option>
            <option value="Clay Soil">Clay Soil</option>
            <option value="Loamy Soil">Loamy Soil</option>
        </select>

        <button type="submit">Analyze Soil</button>

    </form>

    <div id="result"></div>

    <hr>

    <h3>🎤 Voice Assistant</h3>

    <button type="button" onclick="startVoice()">
        🎤 Start Voice Assistant
    </button>

    <button type="button" onclick="readResult()">
        🔊 Speak Result
    </button>

    <p id="voiceStatus">Click Start Voice Assistant</p>

</div>

<script>

// SOIL ANALYSIS
function analyzeSoil(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const mobile = document.getElementById("mobile").value;
    const soilType = document.getElementById("soilType").value;

    let recommendation;

    if (soilType === "Red Soil") {
        recommendation = "Suitable crops include groundnut, ragi and millets.";
    }
    else if (soilType === "Black Soil") {
        recommendation = "Suitable crops include cotton, soybean and pulses.";
    }
    else if (soilType === "Sandy Soil") {
        recommendation = "Suitable crops include groundnut, watermelon and carrots.";
    }
    else if (soilType === "Clay Soil") {
        recommendation = "Suitable crops include paddy and wheat.";
    }
    else {
        recommendation = "Suitable crops include vegetables, maize and pulses.";
    }

    document.getElementById("result").innerHTML = `
        <h3>🌱 Soil Analysis Result</h3>
        <p><b>Farmer Name:</b> ${name}</p>
        <p><b>Mobile Number:</b> ${mobile}</p>
        <p><b>Soil Type:</b> ${soilType}</p>
        <p><b>Crop Recommendation:</b> ${recommendation}</p>
    `;

    speak("Hello " + name + ". Your soil type is " +
        soilType + ". " + recommendation);
}


// VOICE OUTPUT
function speak(message) {

    const speech = new SpeechSynthesisUtterance(message);

    speech.lang = "en-IN";
    speech.rate = 0.9;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}


// VOICE ASSISTANT
function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Please use Google Chrome for voice recognition.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;

    document.getElementById("voiceStatus").innerText =
        "🎤 Listening... Speak now";

    recognition.onresult = function(event) {

        const command =
            event.results[0][0].transcript.toLowerCase();

        document.getElementById("voiceStatus").innerText =
            "You said: " + command;

        if (command.includes("red soil")) {
            document.getElementById("soilType").value = "Red Soil";
        }
        else if (command.includes("black soil")) {
            document.getElementById("soilType").value = "Black Soil";
        }
        else if (command.includes("sandy soil")) {
            document.getElementById("soilType").value = "Sandy Soil";
        }
        else if (command.includes("clay soil")) {
            document.getElementById("soilType").value = "Clay Soil";
        }
        else if (command.includes("loamy soil")) {
            document.getElementById("soilType").value = "Loamy Soil";
        }

        if (command.includes("analyze")) {
            document.getElementById("soilForm").requestSubmit();
        }
        else {
            speak("Voice command received.");
        }
    };

    recognition.onerror = function() {
        document.getElementById("voiceStatus").innerText =
            "Voice error. Please try again.";
    };

    recognition.start();
}


// SPEAK RESULT
function readResult() {

    const result = document.getElementById("result").innerText;

    if (result.trim() === "") {
        speak("Please analyze the soil first.");
    }
    else {
        speak(result);
    }
}

</script>

</body>
</html>
