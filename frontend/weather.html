<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast - Smart Farm Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <select id="languageSelect" onchange="changeLanguage()">
        <option value="en">English</option>
        <option value="kn">ಕನ್ನಡ</option>
    </select>

    <header>
        <h2 data-key="heading">🌱 Smart Farm Planner</h2>

        <nav>
            <a href="index.html" data-key="home">Home</a>
            <a href="dashboard.html" data-key="dashboard">Dashboard</a>
            <a href="soil.html" data-key="soil">Soil Analysis</a>
        </nav>
    </header>

    <section class="hero">
        <h1 data-key="title">🌦 7-Day Weather Forecast</h1>
        <p data-key="description">
            Check weather conditions for your farming location
        </p>
    </section>

    <section class="weather-section">

        <form id="weatherForm">

            <label data-key="village">Enter Your Village or City</label>

            <input
                type="text"
                id="city"
                placeholder="Example: Hassan"
                data-placeholder="cityPlaceholder"
                required>

            <button type="submit" data-key="button">Get Weather</button>

        </form>

        <div id="weatherResult"></div>

    </section>

    <footer>
        <p data-key="footer">© 2026 Smart Farm Planner</p>
    </footer>

    <script src="script.js"></script>

    <script>
        const weatherTranslations = {

            en: {
                heading: "🌱 Smart Farm Planner",
                home: "Home",
                dashboard: "Dashboard",
                soil: "Soil Analysis",
                title: "🌦 7-Day Weather Forecast",
                description: "Check weather conditions for your farming location",
                village: "Enter Your Village or City",
                cityPlaceholder: "Example: Hassan",
                button: "Get Weather",
                footer: "© 2026 Smart Farm Planner"
            },

            kn: {
                heading: "🌱 ಸ್ಮಾರ್ಟ್ ಕೃಷಿ ಯೋಜಕ",
                home: "ಮುಖಪುಟ",
                dashboard: "ಡ್ಯಾಶ್‌ಬೋರ್ಡ್",
                soil: "ಮಣ್ಣಿನ ವಿಶ್ಲೇಷಣೆ",
                title: "🌦 7 ದಿನಗಳ ಹವಾಮಾನ ಮುನ್ಸೂಚನೆ",
                description: "ನಿಮ್ಮ ಕೃಷಿ ಸ್ಥಳದ ಹವಾಮಾನ ಪರಿಸ್ಥಿತಿಯನ್ನು ಪರಿಶೀಲಿಸಿ",
                village: "ನಿಮ್ಮ ಗ್ರಾಮ ಅಥವಾ ನಗರದ ಹೆಸರನ್ನು ನಮೂದಿಸಿ",
                cityPlaceholder: "ಉದಾಹರಣೆ: ಹಾಸನ",
                button: "ಹವಾಮಾನ ಪಡೆಯಿರಿ",
                footer: "© 2026 ಸ್ಮಾರ್ಟ್ ಕೃಷಿ ಯೋಜಕ"
            }

        };

        function changeLanguage() {

            const lang = document.getElementById("languageSelect").value;

            localStorage.setItem("farmLanguage", lang);

            document.querySelectorAll("[data-key]").forEach(element => {
                const key = element.getAttribute("data-key");
                element.textContent = weatherTranslations[lang][key];
            });

            document.querySelectorAll("[data-placeholder]").forEach(element => {
                const key = element.getAttribute("data-placeholder");
                element.placeholder = weatherTranslations[lang][key];
            });

            document.documentElement.lang = lang;
        }

        window.addEventListener("DOMContentLoaded", function () {

            const savedLanguage = localStorage.getItem("farmLanguage") || "en";

            document.getElementById("languageSelect").value = savedLanguage;

            changeLanguage();

        });
    </script>

</body>
</html>
